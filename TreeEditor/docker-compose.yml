name: treeeditor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: treeeditor
      POSTGRES_USER: treeeditor
      POSTGRES_PASSWORD: treeeditor
    ports:
      - "5434:5432"
    volumes:
      - treeeditor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treeeditor -d treeeditor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: TreeEditor/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TreeDatabase: Host=postgres;Port=5432;Database=treeeditor;Username=treeeditor;Password=treeeditor
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  treeeditor-postgres:
